version: '3'

silent: true
dotenv:
  - .env

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  toss-health:
    desc: Check Toss credentials and read-only account access
    cmds:
      - uv run ips-pilot toss-health

  toss-sync:
    desc: Sync a read-only Toss account observation snapshot
    cmds:
      - uv run ips-pilot toss-sync

  toss-performance-refresh:
    desc: Refresh local Toss account performance history
    cmds:
      - uv run ips-pilot performance refresh

  toss-performance-history:
    desc: Show the latest local Toss account performance history
    cmds:
      - uv run ips-pilot performance history --latest

  toss-account-view:
    desc: Show the latest complete Toss account projection
    cmds:
      - uv run ips-pilot account-view

  toss-profiles:
    desc: Show Toss instrument IPS profiles and missing classifications
    cmds:
      - uv run ips-pilot profiles list

  format:
    desc: Format Python code with ruff
    cmds:
      - uv run ruff format .

  lint:
    desc: Lint Python code with ruff
    cmds:
      - uv run ruff check . --fix

  clean:
    desc: Remove cache and build files
    cmds:
      - 'find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true'
      - 'find . -type d -name .pytest_cache -exec rm -rf {} + 2>/dev/null || true'
      - 'find . -type f -name "*.pyc" -delete 2>/dev/null || true'
      - echo "Cleaned up cache files"
