[project]
name = "ips-pilot"
version = "0.1.0"
description = "IPS-based monthly investment operations workbench"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12.0",
    "httpx>=0.28.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
ips-pilot = "cli:app"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.packages.find]
include = ["api*", "integrations*", "services*", "storage*"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.14.2",
]
